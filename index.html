<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32</title>
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./mini_font/css/all.css">
</head>
<body>
    
      <div class="right-section">
         <div class="upper">
            <div class="left">

            </div>
            <h1>Validor Car Control</h1>
            <div class="right">
            </div>
         </div>
        <p>Status :
             <span id ="state-not">Not connected! <i class="fas fa-times"></i></span>
             <span id ="state-yes">Connected! <i class="fas fa-check"></i></span>
            </p>
        <div id="buttons">
                <button id="forward">
                    <i class="fas fa-arrow-alt-circle-up"></i>
                </button>
             <div id="steering">
                <button id="left">
                    <i class="fas fa-arrow-alt-circle-left"></i>
                </button>
                 <div class="div-img">
                    <img src="./img/car-top-view.png" alt="">
                 </div>
                <button id="right">
                    <i class="fas fa-arrow-alt-circle-right"></i>
                </button>
            </div>
             <button id="backward">
                    <i class="fas fa-arrow-alt-circle-down"></i>
                </button>
        </div>

        <div class="battery">
            <div class="esp-battery">
               <div class="battery-upper">
                 <h2>ESP32 battery : </h2>
                 <span>98%</span>
               </div>
               <div class="indicator">
                    <div class="child">

                    </div>
               </div>
            </div>
            <div class="esp-battery">
               <div class="battery-upper">
                 <h2>motors battery : </h2>
                 <span>98%</span>
               </div>
               <div class="indicator">
                    <div class="child">

                    </div>
               </div>
            </div>
        </div>

        <div class="speed">
            <h3>speed : <span id="speed-write">50%</span></h3>
            <div class="indicator">
                <i class="fas fa-minus" id="minus"></i>
                <div class="move">
                    <div class="body" id="speed-body"></div>
                </div>
                <i class="fas fa-plus" id="plus"></i>
            </div>
        </div>
     </div>

    <script src="./app.js"></script>
</body>
</html>
